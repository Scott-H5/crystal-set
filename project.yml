# project.yml
#
# Describes the iPhone version of Crystal Set for XcodeGen, which turns this
# file into an Xcode project (CrystalSet.xcodeproj). The Xcode project is
# generated, not stored in git: edit this file instead, and ios.sh
# regenerates the project every time it builds.
#
# The Mac version doesn't use this file; it's built by build.sh.

name: CrystalSet

options:
  # The oldest iOS version the app runs on.
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Xcode picks the signing certificate and profile automatically.
    # The team (whose certificate signs the app) is passed in by ios.sh
    # from ios-team.txt, so it isn't written here.
    CODE_SIGN_STYLE: Automatic

targets:
  CrystalSet-iOS:
    type: application
    platform: iOS
    # Code shared with the Mac version, plus the iPhone's own screens.
    sources:
      - Shared
      - iOS
    # Creates a scheme, which xcodebuild needs in order to build the target.
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: CrystalSet
        # The same ID as the Mac version: it's the same app on another platform.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.scott-h5.crystalset
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # 1 is iPhone, 2 is iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
    # XcodeGen writes these settings into iOS/Info.plist.
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Crystal Set
        # Keep playing when the screen locks or you switch to another app.
        UIBackgroundModes: [audio]
        # Many old time radio streams are plain http:// Shoutcast/Icecast servers.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # A plain launch screen (required by iOS).
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
